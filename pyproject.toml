[project]
name = "arm-framework"
version = "0.1.0"
description = "Asynchronous Reasoner-Memorizer framework"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8",
    "langchain-openai>=1.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.5",
]

[project.scripts]
arm = "memorizer_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorizer_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "skills/memorizer-memory/scripts"]
